<!-- ══════════════════════════════════════════════════════════════════════
     TradeLog Pro — duplicate fix, no in-place edits required

     Use this INSTEAD of Patch A and Patch B. If you already applied
     those by hand, revert them (or leave them — this block detects the
     work is already done and stays out of the way).

     It fixes the same two things by wrapping existing functions:
       1. editTrade + upsertTrade — an edited TradeLocker trade keeps its
          tlId and its source, so the next sync recognises it instead of
          inserting a second copy.
       2. upsertTrade during a sync — a stop, target, R:R, risk figure or
          playbook you typed in by hand is not overwritten by the null
          coming back from the API.

     Paste before </body>. Order does not matter relative to the other
     add-ons.
     ══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
'use strict';
if (window.__dupFixLoaded) return;
window.__dupFixLoaded = true;

let pendingEdit = null;

/* remember the row as it stood before the form touched it */
const prevEditTrade = window.editTrade;
if (typeof prevEditTrade === 'function') {
  window.editTrade = function (id) {
    try {
      const t = (window.trades || []).find(x => x.id === id);
      pendingEdit = t ? Object.assign({}, t) : null;
    } catch (e) { pendingEdit = null; }
    return prevEditTrade.apply(this, arguments);
  };
}

/* last stop before anything reaches Supabase */
const prevUpsert = window.upsertTrade;
if (typeof prevUpsert === 'function') {
  window.upsertTrade = function (t) {
    try { mend(t); } catch (e) { console.warn('[dupfix] skipped:', e); }
    return prevUpsert.apply(this, arguments);
  };
}

function mend(t) {
  if (!t || t.id == null) return;
  const isEdit = pendingEdit && String(pendingEdit.id) === String(t.id);

  if (isEdit) {
    /* the form has no tlId field, so saveTrade drops it and flips source
       to 'manual'. Put both back — that is the whole duplicate bug. */
    if (!t.tlId && pendingEdit.tlId) {
      t.tlId = pendingEdit.tlId;
      console.log('[dupfix] restored tlId ' + t.tlId + ' on trade ' + t.id);
    }
    if (pendingEdit.source === 'tradelocker') t.source = 'tradelocker';
    return;                      /* never restore anything else here —
                                    a cleared note is a deliberate clear */
  }

  if (!t.tlId) return;

  /* sync path: fill only the fields the API cannot know about */
  const old = (window.trades || []).find(x => x !== t && x.tlId && String(x.tlId) === String(t.tlId));
  if (!old) return;
  ['sl', 'tp', 'rr', 'risk', 'playbookId'].forEach(k => {
    if ((t[k] == null || t[k] === '') && old[k] != null && old[k] !== '') t[k] = old[k];
  });
}
})();
</script>
